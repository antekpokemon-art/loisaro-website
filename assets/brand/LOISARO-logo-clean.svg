  <text x="510" y="165" font-size="118" font-weight="600" class="gold">A</text>
  <text x="590" y="165" font-size="118" font-weight="600" class="white">RO</text>

  <!-- Claim -->
  <line x1="180" y1="235" x2="365" y2="235" stroke="#C8A15A" stroke-width="3"/>
  <line x1="835" y1="235" x2="1020" y2="235" stroke="#C8A15A" stroke-width="3"/>

  <text x="405" y="246"
        font-size="30"
        font-weight="500"
