<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">
  <defs>
    <style>
      .gold{fill:#C8A15A;}
      .white{fill:#FFFFFF;}
      .stroke{fill:none;stroke:#C8A15A;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;}
      text{font-family:Inter,Arial,sans-serif}
    </style>
  </defs>

  <!-- Mountain -->
  <path class="stroke"
        d="M250 55
           L325 15
           L410 70
           L485 28
           L565 80
           L655 40
           L730 72
           L810 48"/>

  <!-- Wordmark -->
